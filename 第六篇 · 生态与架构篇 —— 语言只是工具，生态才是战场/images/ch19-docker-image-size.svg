<svg width="560" height="360" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="360" fill="#FAFAFA" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Docker 镜像大小对比</text>
  <text x="140" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#E76F00">Java (Spring Boot)</text>
  <rect x="30" y="75" width="220" height="210" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <rect x="45" y="90" width="190" height="30" fill="#FFCC80" rx="4"/>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#333">JRE ~180MB</text>
  <rect x="45" y="128" width="190" height="22" fill="#FFE0B2" rx="4"/>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#333">Spring 依赖 ~80MB</text>
  <rect x="45" y="158" width="190" height="14" fill="#FFF3E0" rx="4"/>
  <text x="140" y="170" text-anchor="middle" font-size="10" fill="#333">业务代码 ~2MB</text>
  <text x="140" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="#E76F00">~300MB</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" fill="#666">启动 3-5 秒</text>
  <text x="140" y="260" text-anchor="middle" font-size="11" fill="#666">内存 250MB+</text>
  <text x="420" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#00ADD8">Go (多阶段构建)</text>
  <rect x="310" y="130" width="220" height="100" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <rect x="325" y="145" width="190" height="16" fill="#B2EBF2" rx="4"/>
  <text x="420" y="158" text-anchor="middle" font-size="10" fill="#333">CA 证书 ~0.1MB</text>
  <rect x="325" y="167" width="190" height="40" fill="#80DEEA" rx="4"/>
  <text x="420" y="192" text-anchor="middle" font-size="12" fill="#333">静态二进制 ~12MB</text>
  <text x="420" y="260" text-anchor="middle" font-size="28" font-weight="bold" fill="#00ADD8">~12MB</text>
  <text x="420" y="290" text-anchor="middle" font-size="11" fill="#666">启动 &lt;50ms</text>
  <text x="420" y="310" text-anchor="middle" font-size="11" fill="#666">内存 ~15MB</text>
  <text x="280" y="345" text-anchor="middle" font-size="12" fill="#D32F2F">⚡ Go 镜像比 Java 小 25 倍，启动快 60 倍</text>
</svg>
