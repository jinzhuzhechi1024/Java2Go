<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">数据库访问层架构对比</text>
  <line x1="280" y1="42" x2="280" y2="380" stroke="#CCC" stroke-dasharray="5,3"/>
  <text x="140" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#E76F00">JPA (Hibernate)</text>
  <rect x="60" y="75" width="160" height="34" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <text x="140" y="97" text-anchor="middle" font-size="12" fill="#333">Repository 接口</text>
  <line x1="140" y1="109" x2="140" y2="125" stroke="#E76F00" stroke-width="1.5" marker-end="url(#dbO)"/>
  <rect x="60" y="127" width="160" height="34" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <text x="140" y="149" text-anchor="middle" font-size="12" fill="#333">EntityManager</text>
  <line x1="140" y1="161" x2="140" y2="177" stroke="#E76F00" stroke-width="1.5" marker-end="url(#dbO)"/>
  <rect x="60" y="179" width="160" height="34" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <text x="140" y="201" text-anchor="middle" font-size="12" fill="#333">一级缓存 (Session)</text>
  <line x1="140" y1="213" x2="140" y2="229" stroke="#E76F00" stroke-width="1.5" marker-end="url(#dbO)"/>
  <rect x="60" y="231" width="160" height="34" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <text x="140" y="253" text-anchor="middle" font-size="12" fill="#333">SQL 自动生成</text>
  <line x1="140" y1="265" x2="140" y2="281" stroke="#E76F00" stroke-width="1.5" marker-end="url(#dbO)"/>
  <rect x="60" y="283" width="160" height="34" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <text x="140" y="305" text-anchor="middle" font-size="12" fill="#333">JDBC Driver</text>
  <text x="140" y="345" text-anchor="middle" font-size="11" fill="#E76F00">5 层抽象 | 3 层可能产生</text>
  <text x="140" y="360" text-anchor="middle" font-size="11" fill="#E76F00">性能损耗 / N+1 问题</text>
  <text x="420" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#00ADD8">database/sql</text>
  <rect x="340" y="120" width="160" height="34" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <text x="420" y="142" text-anchor="middle" font-size="12" fill="#333">db.Query / db.Exec</text>
  <line x1="420" y1="154" x2="420" y2="190" stroke="#00ADD8" stroke-width="1.5" marker-end="url(#dbB)"/>
  <rect x="340" y="192" width="160" height="34" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <text x="420" y="214" text-anchor="middle" font-size="12" fill="#333">原生 SQL → Driver</text>
  <line x1="420" y1="226" x2="420" y2="262" stroke="#00ADD8" stroke-width="1.5" marker-end="url(#dbB)"/>
  <rect x="340" y="264" width="160" height="34" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <text x="420" y="286" text-anchor="middle" font-size="12" fill="#333">Rows.Scan</text>
  <text x="420" y="345" text-anchor="middle" font-size="11" fill="#00ADD8">2 层抽象 | 零中间层</text>
  <text x="420" y="360" text-anchor="middle" font-size="11" fill="#00ADD8">SQL 即所见即所得</text>
  <defs>
    <marker id="dbO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#E76F00"/></marker>
    <marker id="dbB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#00ADD8"/></marker>
  </defs>
</svg>
