<?xml version="1.0" encoding="UTF-8"?>
<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>

  <!-- 标题 -->
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Java vs Go：设计哲学对比</text>

  <!-- 分割线 -->
  <line x1="280" y1="48" x2="280" y2="370" stroke="#CCC" stroke-dasharray="5,3"/>

  <!-- 左侧 Java -->
  <text x="135" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#E76F00">Java：重型卡车</text>

  <rect x="35" y="82" width="200" height="42" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="6"/>
  <text x="135" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">全副武装：JVM+Spring+Maven</text>

  <rect x="35" y="134" width="200" height="42" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="135" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">继承体系：is-a 树状耦合</text>

  <rect x="35" y="186" width="200" height="42" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="135" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">异常体系：隐式控制流</text>

  <rect x="35" y="238" width="200" height="42" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="135" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">并发：共享内存 + 锁</text>

  <rect x="35" y="290" width="200" height="42" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="135" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">50关键字，注解，运算符重载</text>

  <!-- 右侧 Go -->
  <text x="425" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#00ADD8">Go：越野摩托</text>

  <rect x="325" y="82" width="200" height="42" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <text x="425" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">轻装上阵：编译器+标准库</text>

  <rect x="325" y="134" width="200" height="42" fill="#E0F7FA" stroke="#00ADD8" stroke-width="1.5" rx="6"/>
  <text x="425" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">组合嵌入：has-a 松耦合</text>

  <rect x="325" y="186" width="200" height="42" fill="#E0F7FA" stroke="#00ADD8" stroke-width="1.5" rx="6"/>
  <text x="425" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">error值：显式传递</text>

  <rect x="325" y="238" width="200" height="42" fill="#E0F7FA" stroke="#00ADD8" stroke-width="1.5" rx="6"/>
  <text x="425" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">并发：Channel通信（CSP）</text>

  <rect x="325" y="290" width="200" height="42" fill="#E0F7FA" stroke="#00ADD8" stroke-width="1.5" rx="6"/>
  <text x="425" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">25关键字，无注解，无重载</text>

  <!-- 底部差异标注 -->
  <rect x="40" y="345" width="480" height="36" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5" rx="6"/>
  <text x="280" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F" font-weight="bold">⚡ 核心差异：Java做加法，Go做减法</text>
</svg>
