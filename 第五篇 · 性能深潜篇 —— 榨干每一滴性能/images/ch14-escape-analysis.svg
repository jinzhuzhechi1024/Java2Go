<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">逃逸分析：栈分配 vs 堆分配</text>
  <rect x="180" y="50" width="200" height="36" fill="#E3F2FD" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333">func createUser() *User</text>
  <line x1="220" y1="86" x2="140" y2="120" stroke="#4CAF50" stroke-width="2" marker-end="url(#ea1)"/>
  <text x="160" y="105" font-size="11" fill="#4CAF50">不逃逸 ✓</text>
  <line x1="340" y1="86" x2="420" y2="120" stroke="#D32F2F" stroke-width="2" marker-end="url(#ea2)"/>
  <text x="380" y="105" font-size="11" fill="#D32F2F">逃逸 ✗</text>
  <rect x="50" y="125" width="180" height="100" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="6"/>
  <text x="140" y="145" text-anchor="middle" font-size="13" fill="#4CAF50" font-weight="bold">栈分配 (Stack)</text>
  <rect x="65" y="155" width="150" height="28" fill="#C8E6C9" rx="4"/>
  <text x="140" y="173" text-anchor="middle" font-size="11" fill="#333">User{Name, Age}</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#666">函数返回后自动回收</text>
  <text x="140" y="215" text-anchor="middle" font-size="11" fill="#4CAF50">~4ns, 零GC压力</text>
  <rect x="330" y="125" width="180" height="100" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2" rx="6"/>
  <text x="420" y="145" text-anchor="middle" font-size="13" fill="#D32F2F" font-weight="bold">堆分配 (Heap)</text>
  <rect x="345" y="155" width="150" height="28" fill="#FFCDD2" rx="4"/>
  <text x="420" y="173" text-anchor="middle" font-size="11" fill="#333">*User → heap</text>
  <text x="420" y="200" text-anchor="middle" font-size="10" fill="#666">GC负责回收</text>
  <text x="420" y="215" text-anchor="middle" font-size="11" fill="#D32F2F">~80ns, 增加GC压力</text>
  <rect x="40" y="250" width="220" height="50" fill="none" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,2" rx="4"/>
  <text x="150" y="270" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">u := User{name: "Luis"}</text>
  <text x="150" y="287" text-anchor="middle" font-size="9" fill="#4CAF50">不返回指针 → 栈分配</text>
  <rect x="300" y="250" width="220" height="50" fill="none" stroke="#D32F2F" stroke-width="1" stroke-dasharray="4,2" rx="4"/>
  <text x="410" y="270" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">return &amp;User{name: "Luis"}</text>
  <text x="410" y="287" text-anchor="middle" font-size="9" fill="#D32F2F">指针逃逸 → 堆分配</text>
  <defs>
    <marker id="ea1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#4CAF50"/></marker>
    <marker id="ea2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#D32F2F"/></marker>
  </defs>
</svg>
