<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">三色标记法：Go GC的核心算法</text>
  <text x="93" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Phase 1: 初始</text>
  <text x="280" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Phase 2: 并发标记</text>
  <text x="467" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Phase 3: 完成</text>
  <text x="93" y="75" text-anchor="middle" font-size="10" fill="#666">Root→A(灰)</text>
  <circle cx="93" cy="110" r="18" fill="#333" stroke="#333"/><text x="93" y="114" text-anchor="middle" font-size="9" fill="#FFF">Root</text>
  <line x1="93" y1="128" x2="93" y2="150" stroke="#666" stroke-width="1.5"/>
  <circle cx="93" cy="170" r="16" fill="#DDD" stroke="#666" stroke-width="2"/><text x="93" y="174" text-anchor="middle" font-size="9" fill="#333">A</text>
  <line x1="93" y1="186" x2="60" y2="210" stroke="#999" stroke-width="1"/>
  <line x1="93" y1="186" x2="126" y2="210" stroke="#999" stroke-width="1"/>
  <circle cx="60" cy="225" r="14" fill="#FFF" stroke="#999" stroke-width="2"/><text x="60" y="229" text-anchor="middle" font-size="8" fill="#999">B</text>
  <circle cx="126" cy="225" r="14" fill="#FFF" stroke="#999" stroke-width="2"/><text x="126" y="229" text-anchor="middle" font-size="8" fill="#999">C</text>
  <text x="93" y="265" text-anchor="middle" font-size="9" fill="#666">A=灰(待处理)</text>
  <text x="93" y="280" text-anchor="middle" font-size="9" fill="#999">B,C=白(未访问)</text>
  <text x="280" y="75" text-anchor="middle" font-size="10" fill="#666">A→B→C 传播</text>
  <circle cx="280" cy="110" r="18" fill="#333" stroke="#333"/><text x="280" y="114" text-anchor="middle" font-size="9" fill="#FFF">Root</text>
  <line x1="280" y1="128" x2="280" y2="150" stroke="#666" stroke-width="1.5"/>
  <circle cx="280" cy="170" r="16" fill="#333" stroke="#333"/><text x="280" y="174" text-anchor="middle" font-size="9" fill="#FFF">A</text>
  <line x1="280" y1="186" x2="247" y2="210" stroke="#666" stroke-width="1.5"/>
  <line x1="280" y1="186" x2="313" y2="210" stroke="#999" stroke-width="1"/>
  <circle cx="247" cy="225" r="14" fill="#DDD" stroke="#666" stroke-width="2"/><text x="247" y="229" text-anchor="middle" font-size="8" fill="#333">B</text>
  <circle cx="313" cy="225" r="14" fill="#FFF" stroke="#999" stroke-width="2"/><text x="313" y="229" text-anchor="middle" font-size="8" fill="#999">C</text>
  <text x="280" y="265" text-anchor="middle" font-size="9" fill="#666">A=黑(完成) B=灰</text>
  <text x="280" y="280" text-anchor="middle" font-size="9" fill="#999">C=白(未访问)</text>
  <text x="467" y="75" text-anchor="middle" font-size="10" fill="#666">全部标记+清扫</text>
  <circle cx="467" cy="110" r="18" fill="#333" stroke="#333"/><text x="467" y="114" text-anchor="middle" font-size="9" fill="#FFF">Root</text>
  <line x1="467" y1="128" x2="467" y2="150" stroke="#666" stroke-width="1.5"/>
  <circle cx="467" cy="170" r="16" fill="#333" stroke="#333"/><text x="467" y="174" text-anchor="middle" font-size="9" fill="#FFF">A</text>
  <line x1="467" y1="186" x2="434" y2="210" stroke="#666" stroke-width="1.5"/>
  <line x1="467" y1="186" x2="500" y2="210" stroke="#666" stroke-width="1.5"/>
  <circle cx="434" cy="225" r="14" fill="#333" stroke="#333"/><text x="434" y="229" text-anchor="middle" font-size="8" fill="#FFF">B</text>
  <circle cx="500" cy="225" r="14" fill="#333" stroke="#333"/><text x="500" y="229" text-anchor="middle" font-size="8" fill="#FFF">C</text>
  <circle cx="467" cy="280" r="14" fill="#FFF" stroke="#D32F2F" stroke-width="2" stroke-dasharray="3,2"/><text x="467" y="284" text-anchor="middle" font-size="8" fill="#D32F2F">D</text>
  <text x="467" y="375" text-anchor="middle" font-size="11" fill="#D32F2F">D=白(未可达) → GC回收 ✗</text>
  <text x="280" y="375" text-anchor="middle" font-size="11" fill="#4CAF50">A,B,C=黑(存活) ✓</text>
  <defs></defs>
</svg>
