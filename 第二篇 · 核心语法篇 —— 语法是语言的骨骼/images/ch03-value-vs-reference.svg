<svg width="560" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#FAFAFA" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">值类型 vs 引用类型：内存布局对比</text>
  <line x1="280" y1="42" x2="280" y2="380" stroke="#CCC" stroke-dasharray="5,3"/>
  <text x="140" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#E76F00">Java</text>
  <rect x="50" y="75" width="180" height="120" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#E76F00" font-weight="bold">栈 (Stack)</text>
  <rect x="65" y="100" width="150" height="24" fill="#FFCC80" rx="4"/>
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#333">int x = 10</text>
  <rect x="65" y="130" width="150" height="24" fill="#FFE0B2" rx="4"/>
  <text x="140" y="146" text-anchor="middle" font-size="11" fill="#333">User u → (引用)</text>
  <rect x="50" y="210" width="180" height="100" fill="#FFE0B2" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="140" y="227" text-anchor="middle" font-size="12" fill="#E76F00" font-weight="bold">堆 (Heap)</text>
  <rect x="75" y="240" width="130" height="50" fill="#FFCC80" rx="4"/>
  <text x="140" y="260" text-anchor="middle" font-size="11" fill="#333">User对象</text>
  <text x="140" y="275" text-anchor="middle" font-size="10" fill="#666">{name, age}</text>
  <line x1="140" y1="154" x2="140" y2="238" stroke="#E76F00" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#va1)"/>
  <text x="140" y="335" text-anchor="middle" font-size="11" fill="#666">基本类型在栈，对象在堆</text>
  <text x="140" y="352" text-anchor="middle" font-size="11" fill="#666">引用是指针</text>
  <text x="420" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#00ADD8">Go</text>
  <rect x="330" y="75" width="180" height="150" fill="#E0F7FA" stroke="#00ADD8" stroke-width="1.5" rx="6"/>
  <text x="420" y="92" text-anchor="middle" font-size="12" fill="#00ADD8" font-weight="bold">栈 (Stack)</text>
  <rect x="345" y="100" width="150" height="24" fill="#B2EBF2" rx="4"/>
  <text x="420" y="116" text-anchor="middle" font-size="11" fill="#333">var x int = 10</text>
  <rect x="345" y="130" width="150" height="50" fill="#80DEEA" rx="4"/>
  <text x="420" y="148" text-anchor="middle" font-size="11" fill="#333">var u User</text>
  <text x="420" y="163" text-anchor="middle" font-size="10" fill="#666">{Name, Age} 直接在栈上</text>
  <rect x="330" y="240" width="180" height="70" fill="#B2EBF2" stroke="#00ADD8" stroke-width="1.5" rx="6"/>
  <text x="420" y="257" text-anchor="middle" font-size="12" fill="#00ADD8" font-weight="bold">堆 (Heap)</text>
  <rect x="355" y="265" width="130" height="34" fill="#80DEEA" rx="4"/>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#333">*User (逃逸时)</text>
  <line x1="420" y1="180" x2="420" y2="263" stroke="#00ADD8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#va2)"/>
  <text x="420" y="335" text-anchor="middle" font-size="11" fill="#666">struct默认在栈</text>
  <text x="420" y="352" text-anchor="middle" font-size="11" fill="#666">指针才逃逸到堆</text>
  <defs>
    <marker id="va1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#E76F00"/></marker>
    <marker id="va2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#00ADD8"/></marker>
  </defs>
</svg>
