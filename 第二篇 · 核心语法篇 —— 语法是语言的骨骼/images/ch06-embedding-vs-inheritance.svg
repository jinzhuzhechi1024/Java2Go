<svg width="560" height="420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#FAFAFA" rx="8"/>
  <text x="280" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">嵌入 vs 继承：组合优于继承</text>
  <line x1="280" y1="42" x2="280" y2="400" stroke="#CCC" stroke-dasharray="5,3"/>
  <text x="140" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#E76F00">Java 继承 (is-a)</text>
  <rect x="80" y="80" width="120" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="2" rx="5"/>
  <text x="140" y="103" text-anchor="middle" font-size="12" fill="#333">Animal</text>
  <line x1="140" y1="116" x2="140" y2="140" stroke="#E76F00" stroke-width="1.5" marker-end="url(#ia1)"/>
  <polygon points="135,140 145,140 140,132" fill="#E76F00"/>
  <rect x="80" y="145" width="120" height="36" fill="#FFE0B2" stroke="#E76F00" stroke-width="2" rx="5"/>
  <text x="140" y="168" text-anchor="middle" font-size="12" fill="#333">Dog extends Animal</text>
  <line x1="140" y1="181" x2="140" y2="205" stroke="#E76F00" stroke-width="1.5" marker-end="url(#ia1)"/>
  <polygon points="135,205 145,205 140,197" fill="#E76F00"/>
  <rect x="80" y="210" width="120" height="36" fill="#FFCC80" stroke="#E76F00" stroke-width="2" rx="5"/>
  <text x="140" y="233" text-anchor="middle" font-size="12" fill="#333">Puppy extends Dog</text>
  <text x="140" y="275" text-anchor="middle" font-size="12" fill="#D32F2F">⚠️ 强耦合：改Animal影响全部</text>
  <text x="140" y="295" text-anchor="middle" font-size="11" fill="#666">is-a 关系，链式依赖</text>
  <text x="420" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#00ADD8">Go 嵌入 (has-a)</text>
  <rect x="320" y="80" width="200" height="50" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <text x="420" y="100" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">struct Dog</text>
  <text x="420" y="118" text-anchor="middle" font-size="10" fill="#666">字段: Name, Age</text>
  <rect x="350" y="135" width="140" height="36" fill="#B2EBF2" stroke="#00ADD8" stroke-width="1.5" rx="5"/>
  <text x="420" y="158" text-anchor="middle" font-size="11" fill="#333">Animal (嵌入字段)</text>
  <rect x="320" y="195" width="200" height="50" fill="#E0F7FA" stroke="#00ADD8" stroke-width="2" rx="6"/>
  <text x="420" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">struct Puppy</text>
  <text x="420" y="233" text-anchor="middle" font-size="10" fill="#666">字段: Toy</text>
  <rect x="350" y="250" width="140" height="36" fill="#B2EBF2" stroke="#00ADD8" stroke-width="1.5" rx="5"/>
  <text x="420" y="273" text-anchor="middle" font-size="11" fill="#333">Dog (嵌入字段)</text>
  <text x="420" y="320" text-anchor="middle" font-size="12" fill="#00ADD8">✓ 松耦合：各块独立</text>
  <text x="420" y="340" text-anchor="middle" font-size="11" fill="#666">has-a 关系，按需组合</text>
  <defs>
    <marker id="ia1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#E76F00"/></marker>
  </defs>
</svg>
